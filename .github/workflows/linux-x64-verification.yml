name: Linux x64 verification

on:
  push:
    branches:
      - codex/promise-rejection-monitoring-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free space for the V8 build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils ca-certificates curl file git libc6-dev make python3 xz-utils

      - name: Build pinned V8 for Linux x64 Release
        run: |
          # The upstream script is stored with Windows line endings and no executable bit.
          sed -i 's/\r$//' Unix/V8Update.sh
          # This job targets x64 only, so avoid downloading the unused i386 sysroot.
          sed -i '/install-sysroot.py --arch=i386/d' Unix/V8Update.sh
          cd Unix
          bash ./V8Update.sh -y x64 Release

      - name: Surface V8 failure diagnostics
        if: failure()
        run: |
          mapfile -t logs < <(find V8/build -type f -name '*.log' -size +0c -printf '%T@ %p\n' | sort -nr | head -8 | cut -d' ' -f2-)
          for log in "${logs[@]}"; do
            message=$(tail -40 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=V8 diagnostic: $log::${message:0:6000}"
          done
          df -h /

      - name: Build ClearScript native library
        run: make -C Unix/ClearScriptV8 CPU=x64

      - name: Run promise-rejection tests
        run: >-
          dotnet test Unix/ClearScriptTest/ClearScriptTest.csproj
          --configuration Release
          --framework net8.0
          --filter FullyQualifiedName~V8ScriptEngine_PromiseRejection
          --property:VisualStudioVersion=17.0

      - name: Record artifact details
        run: |
          mkdir -p artifacts
          native=bin/Release/Unix/ClearScriptV8.linux-x64.so
          {
            file "$native"
            sha256sum "$native"
            stat --printf='%n %s bytes\n' "$native"
            echo 'Required GLIBC symbol versions:'
            readelf --version-info "$native" | grep -o 'GLIBC_[0-9.]*' | sort -Vu
          } | tee artifacts/linux-x64-verification.txt
          cp "$native" artifacts/

      - name: Upload Linux verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClearScript-linux-x64-verification
          path: artifacts/
          if-no-files-found: error
